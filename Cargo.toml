[package]
name = "monsgeek-app"
version = "0.1.0"
edition = "2021"
description = "Monsgeek App: native configurator for MonsGeek / Akko Hall-effect keyboards"

[[bin]]
name = "monsgeek-app"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-channel = "=2.5.0"
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
